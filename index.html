
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castlehelm</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #100d0e;
  color: #d8c29a;
  font-family: Georgia, serif;
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  background:
    linear-gradient(to bottom, #100d0e66, #100d0ef2),
    url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=80")
    center / cover no-repeat;
}

.ornament {
  font-size: 20px;
  letter-spacing: 12px;
  color: #94764b;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(2.5rem, 10vw, 6rem);
  letter-spacing: 8px;
  font-weight: normal;
}

.line {
  width: 100px;
  height: 1px;
  background: #94764b;
  margin: 30px 0;
}

p {
  font-size: 12px;
  letter-spacing: 5px;
  color: #c1b5a5;
}

footer {
  position: absolute;
  bottom: 22px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #877765;
}
</style>
</head>

<body>
  <main class="hero">
    <div class="ornament">✦ ❦ ✦</div>
    <h1>CASTLEHELM</h1>
    <div class="line"></div>
    <p>EVERY CROWN HIDES A SECRET</p>
    <footer>EST. IN SHADOWS</footer>
  </main>
</body>
</html>
